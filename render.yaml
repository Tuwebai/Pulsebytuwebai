services:
  - type: web
    name: pulse-dashboard
    runtime: static
    rootDir: .
    plan: free
    buildCommand: corepack enable; pnpm install --frozen-lockfile; pnpm build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: VITE_DEBUG_MODE
        value: false
      - key: VITE_PUBLIC_URL
        sync: false
      - key: VITE_APP_NAME
        value: Pulse
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  - type: web
    name: pulse-mcp
    runtime: docker
    rootDir: services/pulse-mcp
    dockerfilePath: ./services/pulse-mcp/Dockerfile
    dockerContext: ./services/pulse-mcp
    plan: starter
    healthCheckPath: /healthz
    pullRequestPreviewsEnabled: false
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3333
      - key: PULSE_MCP_REQUIRE_AUTH
        value: false
      - key: PULSE_MCP_ENABLE_MUTATIONS
        value: false
      - key: PULSE_MCP_PUBLIC_URL
        value: https://pulse-mcp-rpnb.onrender.com/mcp
      - key: PULSE_MCP_ALLOWED_HOSTS
        value: pulse-mcp-rpnb.onrender.com
      - key: PULSE_MCP_AUTH_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PULSE_MCP_ALLOWED_PROJECT_IDS
        sync: false
      - key: PULSE_MCP_ALLOWED_USER_IDS
        sync: false
      - key: PULSE_MCP_OPERATOR_USER_ID
        sync: false
      - key: PULSE_ACCESS_REDIRECT_URL
        sync: false
